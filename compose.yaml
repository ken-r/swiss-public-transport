# compose.yml
services:
  app:
    build: .
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tests:
    build: .
    command: python -m unittest discover -s tests -v

volumes:
  postgres_data:
